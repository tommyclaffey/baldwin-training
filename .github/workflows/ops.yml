# Behind the scenes (Nov 10, server/ops.mjs). Nightly: pull an encrypted backup of the live database and keep it here
# for 30 days, off Railway; check the app's error log; then take the demo tour in a real browser (scripts/smoke.mjs).
# Nov 16: also pulls the uploaded files and account folders (encrypted; everything on Sundays, the day's changes on other
# nights; scripts/restore-files.mjs). Every hour: is the app up? (GitHub can run these late; the minute-by-minute
# check is the outside monitor, see README "Behind the scenes".)
# A failed run makes GitHub email the repo owner. Secrets: OPS_TOKEN (same as the Railway variable), APP_URL.
name: Ops
on:
  schedule:
    - cron: '15 8 * * *'    # nightly, about 3–4 am Detroit
    - cron: '45 * * * *'    # health check every hour
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: The app answers
        run: curl -fsS --retry 3 --retry-delay 20 "${{ secrets.APP_URL }}/api/health"
  backup-and-errors:
    if: github.event.schedule == '15 8 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Pull the encrypted backup
        run: |
          curl -fsS --retry 3 -H "Authorization: Bearer ${{ secrets.OPS_TOKEN }}" "${{ secrets.APP_URL }}/api/ops/backup" -o mise.bk
          head -c 7 mise.bk | grep -q MISEBK1
          ls -l mise.bk
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-backup-${{ env.DAY }}
          path: mise.bk
          retention-days: 30
      - name: Pull the uploaded files (everything on Sundays, the last 26 hours' changes other nights)
        run: |
          if [ "$(date -u +%u)" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then KIND=full; Q=""; else KIND=changes; Q="?since=$(date -u -d '26 hours ago' +%FT%TZ)"; fi
          curl -fsS --retry 3 -H "Authorization: Bearer ${{ secrets.OPS_TOKEN }}" "${{ secrets.APP_URL }}/api/ops/files$Q" -o files.bk
          head -c 7 files.bk | grep -q MISEFL1
          [ "$(tail -c 8 files.bk)" = "MISEEND1" ]
          ls -l files.bk
          echo "FILES_KIND=$KIND" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: mise-files-${{ env.FILES_KIND }}-${{ env.DAY }}
          path: files.bk
          retention-days: 35
          compression-level: 0
      - name: Errors in the last day
        if: always()
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.OPS_TOKEN }}" "${{ secrets.APP_URL }}/api/ops/errors?hours=24" -o errors.json
          node -e '
            const e = require("./errors.json").errors;
            if (!e.length) { console.log("No errors in the last 24 hours."); process.exit(0); }
            for (const x of e) console.log(`${x.kind} · ${x.path || "-"} · ${x.message} (×${x.count}, last ${x.last_at})`);
            console.log(`\n${e.length} error(s) in the last 24 hours.`); process.exit(1);'
      # (always: the smoke test still runs on a night the error check fails, so it needs the code and Node too)
      - uses: actions/checkout@v4
        if: always()
      - uses: actions/setup-node@v4
        if: always()
        with: { node-version: 24 }
      - name: Demo smoke test in Chrome (employee and manager, laptop and phone)
        if: always()
        run: CHROME=$(which google-chrome) node scripts/smoke.mjs "${{ secrets.APP_URL }}"
